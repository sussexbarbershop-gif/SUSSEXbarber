# The reminder, about an hour before the appointment.
#
# This is the only reminder the shop sends, and it does not run on Vercel.
# Vercel's scheduler runs a job once a day on this plan, and "an hour before"
# cannot be done once a day when appointments are spread from ten until six. So
# it is called from here every quarter of an hour instead: free, next to the
# code it calls, and needing no account the shop does not already have. The
# route decides who to write to; this only knocks on the door.
#
# Two things worth knowing about GitHub's scheduler, because neither is obvious
# and both would otherwise be found the hard way:
#
#   1. It is not punctual. A run can be several minutes late when GitHub is
#      busy, so a reminder may arrive forty-five minutes before rather than
#      sixty. That is the right way round: late and sent beats early and wrong.
#   2. It stops on its own. GitHub disables scheduled workflows in a repository
#      with no activity for sixty days, and emails the owner when it does. A
#      shop that is running well does not push code, so this will happen
#      eventually — and every reminder the shop sends depends on it.
#
#      There is a second pair of eyes for that. The evening job on Vercel,
#      which cannot be disabled the same way, counts anything today that should
#      have been reminded and was not, and logs it. Zero every day means this
#      is running.
#
# Setup, once: Settings -> Secrets and variables -> Actions -> New repository
# secret, named CRON_SECRET, holding the same value as the one in Vercel. The
# route refuses everything without it, this workflow included.

name: Reminder

on:
  schedule:
    # Every fifteen minutes, 06:00–17:00 UTC. The shop is on Amsterdam time,
    # an hour or two ahead, and opens at ten — so this covers the working day
    # at both ends of the year without running through the night for nothing.
    - cron: '*/15 6-17 * * *'
  # And a button, for checking it works without waiting for the clock.
  workflow_dispatch:

# One at a time. A run that overlaps the last one would ask the same question
# twice, and although the route is safe against that — the row records when the
# email went — there is no reason to make it prove it.
concurrency:
  group: reminder
  cancel-in-progress: false

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the site whether anybody needs reminding
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set on this repository — see the comment at the top of this file."
            exit 1
          fi
          # --fail so a 401 or a 500 turns red here rather than being reported
          # as a successful run that did nothing. -sS keeps it quiet unless
          # something goes wrong, and then says what.
          curl --fail --silent --show-error --max-time 60 \
               --header "Authorization: Bearer $CRON_SECRET" \
               "https://sussexbarber.nl/api/daily?job=soon"
          echo
